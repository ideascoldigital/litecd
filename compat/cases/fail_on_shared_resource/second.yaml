apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-second
spec:
  project: default
  source: {repoURL: <REPO_URL>, targetRevision: main, path: m}
  destination: {server: https://kubernetes.default.svc, namespace: <NS>}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [FailOnSharedResource=true]
    retry: {limit: 1, backoff: {duration: 1s, factor: 2, maxDuration: 5s}}
