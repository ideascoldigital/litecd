apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  annotations:
    link.argocd.argoproj.io/docs: https://example.com/docs
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      terminationGracePeriodSeconds: 0
      initContainers:
        - name: sidecar
          image: registry.k8s.io/pause:3.10
          restartPolicy: Always
          resources:
            requests: {cpu: 5m, memory: 8Mi}
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - {port: 80}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
data:
  key: one
---
apiVersion: v1
kind: Secret
metadata:
  name: creds
stringData:
  password: not-a-real-password
data:
  token: bm90LWEtcmVhbC10b2tlbg==
