apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: denied-auto
spec:
  project: compat-windows
  source:
    repoURL: <REPO_URL>
    targetRevision: main
    path: denied-auto
  destination:
    server: https://kubernetes.default.svc
    namespace: <NS>
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
