apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: list
spec:
  generators:
    - list:
        elements:
          - {name: a, env: dev}
          - {name: b, env: prod}
  template:
    metadata:
      name: 'list-{{name}}'
      labels: {compat.litecd.dev/case: <CASE>}
      annotations: {compat-env: '{{env}}'}
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: default
      source: {repoURL: <REPO_URL>, targetRevision: main, path: 'apps/{{name}}'}
      destination: {server: https://kubernetes.default.svc, namespace: '<NS>-{{name}}'}
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
