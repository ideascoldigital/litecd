apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sync-failure-retry
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: <REPO_URL>
    targetRevision: main
    path: m
  destination:
    server: https://kubernetes.default.svc
    namespace: <NS>
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 2
      backoff: {duration: 1s, factor: 2, maxDuration: 10s}
