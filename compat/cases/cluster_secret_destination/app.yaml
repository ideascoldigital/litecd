apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: remote-by-name
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source: {repoURL: <REPO_URL>, targetRevision: main, path: byname}
  destination: {name: remote, namespace: <NS>}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: remote-by-server
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source: {repoURL: <REPO_URL>, targetRevision: main, path: byserver}
  destination: {server: 'https://kubernetes.default.svc.cluster.local', namespace: <NS>}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
