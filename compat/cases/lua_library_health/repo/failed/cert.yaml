apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web
spec:
  secretName: web-tls
  dnsNames: [web.example.com]
  issuerRef: {name: ca, kind: ClusterIssuer}
status:
  conditions:
    - type: Ready
      status: "False"
      reason: Test
      message: Issuing certificate as Secret does not exist
