apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: manual-sync
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: <REPO_URL>
    targetRevision: main
    path: m
  destination:
    server: https://kubernetes.default.svc
    namespace: <NS>
  syncPolicy:
    syncOptions: [CreateNamespace=true]
