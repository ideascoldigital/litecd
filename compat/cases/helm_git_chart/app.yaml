apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-git-chart
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: <REPO_URL>
    targetRevision: main
    path: chart
    helm:
      releaseName: demo
      valuesObject:
        replicas: 2
        message: from-values-object
        extra: from-values-object
      parameters:
        - {name: message, value: from-parameter}
  destination:
    server: https://kubernetes.default.svc
    namespace: <NS>
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
