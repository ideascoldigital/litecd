# Builds the litecd image and pushes it to GHCR, so clusters with more than
# one node pull it from a registry instead of deploy/build.sh's local image.
# Tags: the commit SHA always; `latest` on main; `vX.Y.Z` on a version tag,
# which also publishes the GitHub release (the tag must match Cargo.toml).
name: image

on:
  push:
    branches: [main, "ci/**"]
    # Path filters do not apply to tag pushes.
    tags: ["v*"]
    paths:
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - "deploy/Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: write # the release, on version tags
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/litecd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $want"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: /tmp/litecd-target
          key: musl-${{ hashFiles('Cargo.lock') }}
          restore-keys: musl-
      # The static musl binary, as deploy/build.sh makes it.
      - name: build
        run: |
          docker run --rm -v "$PWD:/work" -w /work -v /tmp/litecd-target:/cache \
            -e CARGO_TARGET_DIR=/cache/target rust:1-alpine sh -c \
            'apk add --no-cache musl-dev gcc make >/dev/null && cargo build --release --locked'
          mkdir -p ctx && cp deploy/Dockerfile ctx/ && sudo cp /tmp/litecd-target/target/release/litecd ctx/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        run: |
          tags="-t $IMAGE:${GITHUB_SHA}"
          [ "$GITHUB_REF" = refs/heads/main ] && tags="$tags -t $IMAGE:latest"
          [ "$GITHUB_REF_TYPE" = tag ] && tags="$tags -t $IMAGE:${GITHUB_REF_NAME}"
          docker build $tags ctx
          docker push --all-tags "$IMAGE"
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --notes "Image: \`$IMAGE:$GITHUB_REF_NAME\` (also \`$IMAGE:$GITHUB_SHA\`)."
