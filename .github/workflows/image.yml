# Builds the litecd image and pushes it to GHCR, so clusters with more than
# one node pull it from a registry instead of deploy/build.sh's local image.
# Tags: the commit SHA always; `latest` on main; `vX.Y.Z` on a version tag,
# which also publishes the GitHub release (the tag must match Cargo.toml).
# Each tag also has a `-argocd-ui` variant (`vX.Y.Z-argocd-ui`,
# `latest-argocd-ui`, `<sha>-argocd-ui`): the same build with the
# DEPRECATED argocd-ui-compat feature (docs/spec.md, Deprecated
# compatibility).
name: image

on:
  push:
    branches: [main, "ci/**"]
    # Path filters do not apply to tag pushes.
    tags: ["v*"]
    paths:
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - "deploy/Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: write # the release, on version tags
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/litecd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $want"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: /tmp/litecd-target
          key: musl-${{ hashFiles('Cargo.lock') }}
          restore-keys: musl-
      # The static musl binary, as deploy/build.sh makes it, without and
      # with the argocd-ui-compat feature.
      - name: build
        run: |
          docker run --rm -v "$PWD:/work" -w /work -v /tmp/litecd-target:/cache \
            -e CARGO_TARGET_DIR=/cache/target rust:1-alpine sh -c \
            'apk add --no-cache musl-dev gcc make >/dev/null &&
             cargo build --release --locked && cp /cache/target/release/litecd /cache/litecd &&
             cargo build --release --locked --features argocd-ui-compat && cp /cache/target/release/litecd /cache/litecd-argocd-ui'
          mkdir -p ctx ctx-argocd-ui
          cp deploy/Dockerfile ctx/ && sudo cp /tmp/litecd-target/litecd ctx/litecd
          cp deploy/Dockerfile ctx-argocd-ui/ && sudo cp /tmp/litecd-target/litecd-argocd-ui ctx-argocd-ui/litecd
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        run: |
          names="${GITHUB_SHA}"
          [ "$GITHUB_REF" = refs/heads/main ] && names="$names latest"
          [ "$GITHUB_REF_TYPE" = tag ] && names="$names ${GITHUB_REF_NAME}"
          tags="" ui_tags=""
          for n in $names; do tags="$tags -t $IMAGE:$n"; ui_tags="$ui_tags -t $IMAGE:$n-argocd-ui"; done
          docker build $tags ctx
          docker build $ui_tags ctx-argocd-ui
          docker push --all-tags "$IMAGE"
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # install.yaml: deploy/install on this release's image;
        # takeover.yaml: only litecd's own objects, for a namespace Argo CD
        # is installed in. install.sh applies one of them.
        run: |
          deploy/bundle.sh "$IMAGE:$GITHUB_REF_NAME" > install.yaml
          deploy/bundle.sh --takeover "$IMAGE:$GITHUB_REF_NAME" > takeover.yaml
          sha256sum install.yaml takeover.yaml > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --notes "Install on the cluster of your current kube context: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | LITECD_VERSION=$GITHUB_REF_NAME sh\`, or \`kubectl create namespace argocd && kubectl apply --server-side -f https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.yaml\`.

          Image: \`$IMAGE:$GITHUB_REF_NAME\` (also \`$IMAGE:$GITHUB_SHA\`). With the deprecated Argo CD UI compatibility mode (docs/spec.md, Deprecated compatibility): \`$IMAGE:$GITHUB_REF_NAME-argocd-ui\`." \
            install.yaml takeover.yaml SHA256SUMS
