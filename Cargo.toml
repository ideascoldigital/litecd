[package]
name = "litecd"
version = "0.1.0"
edition = "2024"
description = "GitOps continuous delivery in one small Rust binary that reads Argo CD's Application, AppProject and ApplicationSet manifests unchanged"
license = "Apache-2.0"
repository = "https://github.com/jairoFernandez/litecd"
readme = "README.md"
keywords = ["kubernetes", "gitops", "continuous-delivery", "argocd-compatible"]
categories = ["command-line-utilities"]
rust-version = "1.90"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.32", features = ["derive", "env"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "runtime"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1.44.1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mlua = { version = "0.12", features = ["lua51", "vendored", "serialize", "send"] }
globset = "0.4"
tar = "0.4"
base64 = "0.22"
ring = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
http = "1"
gtmpl = "0.7"
secrecy = "0.10"
chrono-tz = "0.10.4"
regex = "1.13.1"
# argocd-ui-compat only: gzip for the trees written to Argo CD's Redis.
flate2 = { version = "1.1", optional = true, default-features = false, features = ["rust_backend"] }

[features]
default = []
# DEPRECATED: write resource trees to the Redis of Argo CD's web UI
# (docs/spec.md, Deprecated compatibility). Off by default.
argocd-ui-compat = ["dep:flate2"]
